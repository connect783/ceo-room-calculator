<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CEO Room ROI Calculator</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#060b37;color:#fff;font-family:-apple-system,'Segoe UI',sans-serif;padding:20px 16px 50px}
.dots{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:16px}
.dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,0.2);border:none;cursor:pointer;padding:0;transition:all 0.3s}
.dot.active{background:#f3b61f;width:18px;border-radius:4px}
.dot.ans-yes{background:#5BAD8A;border-radius:50%}
.dot.ans-sometimes{background:#f3b61f;border-radius:50%}
.dot.ans-no{background:#ff6f61;border-radius:50%}
.prog{height:4px;background:rgba(255,255,255,0.1);border-radius:2px;overflow:hidden;margin-bottom:18px}
.prog-fill{height:100%;background:linear-gradient(90deg,#f3b61f,#ff6f61);border-radius:2px;transition:width 0.4s}
.pillar{font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;margin-bottom:10px}
.qbox{background:rgba(255,255,255,0.04);border:1px solid rgba(243,182,31,0.2);border-radius:12px;padding:22px 18px;text-align:center;font-size:18px;font-weight:700;line-height:1.4;margin-bottom:20px}
.btns{display:flex;flex-direction:column;gap:10px;margin-bottom:18px}
.abtn{width:100%;padding:16px;border:2px solid rgba(255,255,255,0.12);border-radius:10px;background:rgba(255,255,255,0.04);color:rgba(255,255,255,0.8);font-size:15px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;cursor:pointer;transition:all 0.2s}
.abtn.sel-yes{border-color:#5BAD8A;background:rgba(91,173,138,0.12);color:#5BAD8A}
.abtn.sel-sometimes{border-color:#f3b61f;background:rgba(243,182,31,0.1);color:#f3b61f}
.abtn.sel-no{border-color:#ff6f61;background:rgba(255,111,97,0.1);color:#ff6f61}
.nav{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.back{background:transparent;color:#f3b61f;border:2px solid rgba(243,182,31,0.4);padding:10px 16px;border-radius:8px;font-size:12px;font-weight:700;text-transform:uppercase;cursor:pointer;letter-spacing:0.04em}
.revsec{flex:1;display:flex;flex-direction:column;gap:10px}
.revlbl{font-size:10px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.5)}
.revinput{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.15);color:#fff;padding:12px 14px;border-radius:8px;font-size:17px;width:100%;outline:none}
.revinput:focus{border-color:#f3b61f}
.calcbtn{background:linear-gradient(135deg,#f3b61f,#c8900a);color:#060b37;border:none;padding:14px;border-radius:8px;font-size:13px;font-weight:900;text-transform:uppercase;letter-spacing:0.04em;cursor:pointer;width:100%}
.calcbtn:disabled{opacity:0.4}
.nextbtn{background:transparent;color:#f3b61f;border:2px solid rgba(243,182,31,0.4);padding:10px 16px;border-radius:8px;font-size:12px;font-weight:700;text-transform:uppercase;cursor:pointer;letter-spacing:0.04em}
#results{display:none}
.rtitle{font-size:20px;font-weight:900;text-transform:uppercase;text-align:center;margin-bottom:20px;line-height:1.3}
.rcard{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:16px;margin-bottom:12px}
.rlbl{font-size:9px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:rgba(255,255,255,0.5);margin-bottom:10px}
.srow{display:flex;align-items:center;gap:12px}
.sbg{flex:1;height:10px;background:rgba(255,255,255,0.08);border-radius:5px;overflow:hidden}
.sbar{height:100%;border-radius:5px;background:linear-gradient(90deg,#ff6f61,#f3b61f)}
.spct{font-size:20px;font-weight:900;flex-shrink:0}
.snote{font-size:11px;color:rgba(255,255,255,0.5);margin-top:8px;line-height:1.6}
.rings{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.rlb{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:6px}
.rsub{font-size:9px;color:rgba(255,255,255,0.5);margin-top:4px}
.feel p{font-size:13px;line-height:1.8;color:#fff;margin-bottom:10px}
.feelnote{font-size:12px;color:rgba(255,255,255,0.5);border-top:1px solid rgba(255,255,255,0.08);padding-top:10px;margin-top:4px;line-height:1.75}
.goldcard{background:rgba(243,182,31,0.06);border:2px solid #f3b61f;border-radius:12px;padding:18px;margin-bottom:12px;text-align:center}
.goldtitle{font-size:16px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:#f3b61f;margin-bottom:8px}
.effnote{font-size:14px;color:rgba(255,255,255,0.55);margin-bottom:14px;line-height:1.7}
.nums{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.numbox{background:rgba(0,0,0,0.25);border-radius:10px;padding:14px 8px}
.numlbl{font-size:9px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:rgba(255,255,255,0.5);margin-bottom:6px}
.numbig{font-weight:900;line-height:1}
.numsub{font-size:10px;color:rgba(255,255,255,0.5);margin-top:4px}
.floor{background:rgba(243,182,31,0.08);border-radius:8px;padding:10px 12px;margin-bottom:14px}
.floor p{font-size:11px;color:#f3b61f;line-height:1.7;text-align:center}
.apg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.apgcard{background:rgba(0,0,0,0.2);border-radius:8px;padding:10px}
.apgbar{width:18px;height:2px;background:#f3b61f;margin-bottom:7px}
.apgt{font-size:14px;font-weight:800;color:#fff;margin-bottom:3px}
.apgd{font-size:13px;color:rgba(255,255,255,0.5);line-height:1.55}
